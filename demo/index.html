<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人脸活体检测 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

.camera-wrapper {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto 20px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
}

#video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transform: scaleX(-1);        /* 取消默认镜像 */
}

#canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    transform: scaleX(-1);        /* 与视频保持一致 */
    pointer-events: none;
}

        /* 其他样式保持不变 */
        .status-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-panel h3 {
            margin-bottom: 15px;
            color: #555;
            font-size: 16px;
        }

        .status-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 25px;
            background: #e9ecef;
            color: #666;
            font-size: 14px;
            transition: all 0.3s;
        }

        .status-item.visible {
            display: flex;
        }

        .status-item.current {
            background: #fff3cd;
            color: #856404;
            animation: pulse 1.5s infinite;
        }

        .status-item.completed {
            background: #d4edda;
            color: #155724;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .result-panel {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .result-panel img {
            max-width: 300px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 人脸活体检测</h1>

        <!-- 配置面板（保持不变） -->
        <div class="config-panel">
            <h3>⚙️ 检测配置</h3>
            <div class="config-row">
                <div class="config-item"><input type="checkbox" id="actionBlink" checked><label for="actionBlink">眨眼</label></div>
                <div class="config-item"><input type="checkbox" id="actionMouth" checked><label for="actionMouth">张嘴</label></div>
                <div class="config-item"><input type="checkbox" id="actionLeft" checked><label for="actionLeft">左转头</label></div>
                <div class="config-item"><input type="checkbox" id="actionRight" checked><label for="actionRight">右转头</label></div>
                <div class="config-item"><input type="checkbox" id="actionNod" checked><label for="actionNod">点头</label></div>
            </div>
            <div class="config-row">
                <div class="config-item">
                    <label for="actionOrder">动作顺序：</label>
                    <select id="actionOrder">
                        <option value="random">随机</option>
                        <option value="fixed">固定</option>
                    </select>
                </div>
                <div class="config-item">
                    <input type="checkbox" id="enableVoice" checked>
                    <label for="enableVoice">语音提示</label>
                </div>
            </div>
        </div>

        <!-- 摄像头区域 -->
        <div class="camera-wrapper" id="cameraWrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- 状态面板（保持不变） -->
        <div class="status-panel">
            <h3>📋 检测进度</h3>
            <ul class="status-list">
                <li id="faceDetected" class="status-item visible">🔍 检测人脸</li>
                <li id="blink" class="status-item">👁️ 眨眼</li>
                <li id="openMouth" class="status-item">👄 张嘴</li>
                <li id="turnLeft" class="status-item">👈 左转头</li>
                <li id="turnRight" class="status-item">👉 右转头</li>
                <li id="nod" class="status-item">🙌 点头</li>
            </ul>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn btn-primary">开始检测</button>
            <button id="retryBtn" class="btn btn-secondary" style="display:none;">重新检测</button>
        </div>

        <div id="resultContainer" class="result-panel">
            <h3>✅ 活体检测通过</h3>
            <img id="capturedImage" alt="采集照片">
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
